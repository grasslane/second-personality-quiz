<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第二人格测评 · 管理后台</title>
<!--
  ════════════════════════════════════════════════════════════
  管理后台（测试码管理）
  ─ 登录：使用你在 Supabase Authentication → Users 里创建的管理员账号
    （邮箱 + 密码），并已执行 select public.grant_admin('你的UID')。
  ─ 功能：查看当前测试码（明文，用于自动发货）、一键更换测试码
    （更换后旧码立即失效，防盗卖）、测试记录查看、登出。
  ─ 配置：下方 CONFIG.supabase 填项目 URL 与 anon key。
  ════════════════════════════════════════════════════════════
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='8' fill='%236B5BD3'/%3E%3Ccircle cx='20' cy='16' r='8' fill='%23E0506B' opacity='0.85'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F0E8; --card:#FFFFFF; --ink:#221F33; --sub:#8B8698; --line:#E6E0D4;
  --accent:#6B5BD3; --accent-soft:#F1EEFB; --hot:#E0506B; --ok:#3E8E6E; --warn:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:10px;padding:18px 0 14px}
.brand .logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--hot));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:1px}
.brand h1{font-size:19px;font-weight:800}
.brand .tag{font-size:12px;color:var(--sub);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=email]{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
button:hover{filter:brightness(1.05)}
button.ghost{background:var(--accent-soft);color:var(--accent)}
button.danger{background:#FDEBEF;color:var(--hot)}
button.warn{background:#FCF0DC;color:var(--warn)}
button.sm{padding:8px 14px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);word-break:break-all}
th{color:var(--sub);font-weight:600;font-size:12px}
th.c-t,td.c-t{width:110px}
th.c-h,td.c-h{width:110px}
.empty{color:var(--sub);font-size:13px;padding:14px 4px;text-align:center}
.msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px}
.msg.err{color:var(--hot)}
.msg.ok{color:var(--ok)}
.codebox{border:1px dashed var(--accent);border-radius:12px;padding:16px;background:var(--accent-soft);text-align:center;margin:6px 0 4px}
.codebox .code{font-family:Consolas,Menlo,monospace;font-size:28px;font-weight:800;letter-spacing:3px;color:var(--accent);user-select:all}
.codebox .meta{font-size:12px;color:var(--sub);margin-top:6px}
.warnline{font-size:12px;color:var(--warn);margin-top:10px}
.hidden{display:none!important}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#221F33;color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.toast.show{opacity:.95}
.loading{opacity:.45;pointer-events:none}
footer{color:var(--sub);font-size:12px;text-align:center;padding:18px 0 30px}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">SP</div>
    <div>
      <h1>第二人格测评 · 管理后台</h1>
      <div class="tag">当前测试码 · 更换 · 测试记录</div>
    </div>
  </div>

  <!-- 登录视图 -->
  <div id="view-login" class="card hidden">
    <h2><span class="dot"></span>管理员登录</h2>
    <div class="row">
      <input type="email" id="login-email" placeholder="管理员邮箱" autocomplete="username">
    </div>
    <div style="height:10px"></div>
    <div class="row">
      <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password">
    </div>
    <div class="row" style="margin-top:14px">
      <button id="btn-login" style="flex:1">登录</button>
    </div>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- 后台视图 -->
  <div id="view-panel" class="hidden">

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0"><span class="dot"></span>当前测试码</h2>
        <button class="ghost sm" id="btn-refresh-code">刷新</button>
      </div>
      <div id="code-box" class="codebox"><div class="empty">加载中…</div></div>
      <div class="row" style="margin-top:12px">
        <button id="btn-copy" style="flex:1">复制测试码</button>
        <button class="warn" id="btn-change" style="flex:1">更换测试码</button>
      </div>
      <div class="warnline">更换测试码后，旧码立即失效。请把新码同步到你的自动发货设置。</div>

      <div id="change-form" class="hidden" style="margin-top:14px">
        <div class="row">
          <input type="text" id="new-code" placeholder="输入新测试码，如 SP-XXXX-XXXX（4 位以上）" maxlength="20" autocomplete="off">
          <button class="ghost" id="btn-random">随机生成</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="btn-confirm-change" style="flex:1">确认更换（旧码立即失效）</button>
          <button class="ghost" id="btn-cancel-change" style="flex:1">取消</button>
        </div>
        <div class="msg" id="change-msg"></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0"><span class="dot"></span>测试记录</h2>
        <button class="ghost sm" id="btn-refresh-attempts">刷新</button>
      </div>
      <div id="attempts-table"><div class="empty">加载中…</div></div>
    </div>

    <button class="danger" id="btn-logout" style="width:100%;margin-bottom:10px">退出登录</button>
  </div>

  <footer>本测试纯属娱乐 · 结果仅供参考</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════ 配置：填 Supabase 项目 URL 与 anon key ══════════ */
var CONFIG = {
  supabase: {
    url: "https://udyluqxfizxjtqkohava.supabase.co",     // 形如 https://xxxx.supabase.co
    anonKey: "sb_publishable_wccfEO4BPB6cxEufxYbNiQ_pI6jWfaG"  // Settings → API → anon public key
  }
};

/* ---------- Supabase REST（无第三方依赖） ---------- */
var SESSION_KEY = "second_persona_admin_session";
var session = null;
function sGet() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) { return null; }
}
function sSet(obj) {
  if (obj) { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); }
  else { localStorage.removeItem(SESSION_KEY); }
  session = obj;
}
function expiredAt(expiresIn) {
  return Date.now() + (expiresIn - 30) * 1000;
}
function apiUrl(path) {
  return CONFIG.supabase.url + path;
}
function authHeaders(token) {
  return {
    "apikey": CONFIG.supabase.anonKey,
    "Authorization": "Bearer " + (token || CONFIG.supabase.anonKey),
    "Content-Type": "application/json"
  };
}
function login(email, password) {
  return fetch(apiUrl("/auth/v1/token?grant_type=password"), {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ email: email, password: password })
  }).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok) { throw new Error((data && (data.msg || data.error_description)) || "登录失败"); }
      sSet({ access_token: data.access_token, refresh_token: data.refresh_token, expires_at: expiredAt(data.expires_in) });
      return data;
    });
  });
}
function refreshSession() {
  if (!session || !session.refresh_token) { return Promise.reject(new Error("no-session")); }
  return fetch(apiUrl("/auth/v1/token?grant_type=refresh_token"), {
    method: "POST",
    headers: authHeaders(),
    body: JSON.stringify({ refresh_token: session.refresh_token })
  }).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok) { throw new Error("refresh-failed"); }
      sSet({ access_token: data.access_token, refresh_token: data.refresh_token, expires_at: expiredAt(data.expires_in) });
      return data;
    });
  });
}
function logout() {
  if (session) {
    fetch(apiUrl("/auth/v1/logout"), { method: "POST", headers: authHeaders(session.access_token) }).catch(function () {});
  }
  sSet(null);
}
function rpc(fn, params) {
  if (!session) { return Promise.reject(new Error("no-session")); }
  return fetch(apiUrl("/rest/v1/rpc/" + fn), {
    method: "POST",
    headers: authHeaders(session.access_token),
    body: JSON.stringify(params || {})
  }).then(function (res) {
    if (res.status === 401) {
      return refreshSession().then(function () {
        return fetch(apiUrl("/rest/v1/rpc/" + fn), {
          method: "POST",
          headers: authHeaders(session.access_token),
          body: JSON.stringify(params || {})
        });
      });
    }
    return res;
  }).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok) {
        var msg = "操作失败";
        try {
          if (typeof data === "string") { msg = data; }
          else if (data && data.message) { msg = data.message; }
          else if (data && data.msg) { msg = data.msg; }
        } catch (e) {}
        throw new Error(msg);
      }
      return data;
    });
  });
}

/* ---------- 视图控制 ---------- */
var viewLogin = document.getElementById("view-login");
var viewPanel = document.getElementById("view-panel");
var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
}
function showLogin() {
  viewLogin.classList.remove("hidden");
  viewPanel.classList.add("hidden");
}
function showPanel() {
  viewLogin.classList.add("hidden");
  viewPanel.classList.remove("hidden");
  refreshAll();
}
function setLoading(el, on) {
  if (on) { el.classList.add("loading"); el.disabled = true; }
  else { el.classList.remove("loading"); el.disabled = false; }
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ---------- 当前测试码 ---------- */
var TYPE_NAMES = ["白昼完美演员", "深水守密者", "逆风点火者", "午夜清醒者"];
function renderCurrentCode(data) {
  var box = document.getElementById("code-box");
  if (!data || !data.code) {
    box.innerHTML = '<div class="empty">尚未设置测试码，请点「更换测试码」设置。</div>';
    return;
  }
  box.innerHTML = '<div class="code">' + escapeHtml(data.code) + '</div>' +
    '<div class="meta">最近更新：' + escapeHtml(data.updated || "—") + '</div>';
}
function refreshCurrentCode() {
  var btn = document.getElementById("btn-refresh-code");
  setLoading(btn, true);
  rpc("admin_get_current_code", {}).then(function (data) {
    renderCurrentCode(data);
  }).catch(function (e) {
    document.getElementById("code-box").innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
  }).finally(function () { setLoading(btn, false); });
}
function copyCurrentCode() {
  var code = (document.querySelector("#code-box .code") || {}).textContent;
  if (!code) { toast("暂无可复制的测试码"); return; }
  var done = function () { toast("已复制，可直接粘贴到自动发货设置"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(function () { fallbackCopy(code, done); });
  } else {
    fallbackCopy(code, done);
  }
}
function fallbackCopy(text, done) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败，请手动选择复制"); }
  document.body.removeChild(ta);
}

/* ---------- 更换测试码 ---------- */
function randomCode() {
  var pool = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  function seg() {
    var s = "";
    for (var i = 0; i < 4; i++) { s += pool[Math.floor(Math.random() * pool.length)]; }
    return s;
  }
  return "SP-" + seg() + "-" + seg();
}
function openChangeForm() {
  document.getElementById("change-form").classList.remove("hidden");
  document.getElementById("new-code").value = "";
  document.getElementById("change-msg").textContent = "";
  document.getElementById("change-msg").className = "msg";
  document.getElementById("new-code").focus();
}
function closeChangeForm() {
  document.getElementById("change-form").classList.add("hidden");
}
function confirmChange() {
  var input = document.getElementById("new-code").value.trim();
  if (input.length < 4) {
    document.getElementById("change-msg").textContent = "测试码至少 4 位";
    document.getElementById("change-msg").className = "msg err";
    return;
  }
  var btn = document.getElementById("btn-confirm-change");
  var msg = document.getElementById("change-msg");
  msg.textContent = "正在更换…";
  msg.className = "msg";
  setLoading(btn, true);
  rpc("admin_set_code", { p_code: input }).then(function (data) {
    closeChangeForm();
    toast("测试码已更换，旧码立即失效");
    refreshCurrentCode();
    return data;
  }).catch(function (e) {
    msg.textContent = e.message;
    msg.className = "msg err";
  }).finally(function () { setLoading(btn, false); });
}

/* ---------- 测试记录 ---------- */
function renderAttempts(data) {
  var box = document.getElementById("attempts-table");
  if (!data || !data.length) {
    box.innerHTML = '<div class="empty">暂无测试记录。</div>';
    return;
  }
  var rows = data.map(function (a) {
    return '<tr>' +
      '<td class="c-t">' + escapeHtml(a.at || "—") + '</td>' +
      '<td class="c-t">' + escapeHtml(TYPE_NAMES[a.type] || ("类型 " + a.type)) + '</td>' +
      '<td class="c-h">' + escapeHtml(a.hash || "—") + '</td>' +
      '</tr>';
  }).join("");
  box.innerHTML = '<table><colgroup><col style="width:34%"><col style="width:38%"><col style="width:28%"></colgroup>' +
    '<thead><tr><th>时间</th><th>结果类型</th><th>测试码</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}
function refreshAttempts() {
  var btn = document.getElementById("btn-refresh-attempts");
  setLoading(btn, true);
  rpc("admin_list_attempts", { p_limit: 200 }).then(function (data) { renderAttempts(data); }).catch(function (e) {
    document.getElementById("attempts-table").innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
  }).finally(function () { setLoading(btn, false); });
}
function refreshAll() {
  refreshCurrentCode(); refreshAttempts();
}

/* ---------- 登录 / 登出 ---------- */
document.getElementById("btn-login").addEventListener("click", function () {
  var email = document.getElementById("login-email").value.trim();
  var pass = document.getElementById("login-pass").value;
  var msg = document.getElementById("login-msg");
  var btn = document.getElementById("btn-login");
  if (!email || !pass) { msg.textContent = "请输入邮箱和密码"; msg.className = "msg err"; return; }
  msg.textContent = "登录中…";
  msg.className = "msg";
  setLoading(btn, true);
  login(email, pass).then(function () {
    msg.textContent = "";
    showPanel();
  }).catch(function (e) {
    msg.textContent = e.message;
    msg.className = "msg err";
    setLoading(btn, false);
  });
});
document.getElementById("btn-logout").addEventListener("click", function () {
  logout();
  showLogin();
  toast("已退出登录");
});
document.getElementById("btn-refresh-code").addEventListener("click", refreshCurrentCode);
document.getElementById("btn-copy").addEventListener("click", copyCurrentCode);
document.getElementById("btn-change").addEventListener("click", openChangeForm);
document.getElementById("btn-random").addEventListener("click", function () {
  var inp = document.getElementById("new-code");
  inp.value = randomCode();
  inp.focus();
});
document.getElementById("btn-confirm-change").addEventListener("click", confirmChange);
document.getElementById("btn-cancel-change").addEventListener("click", closeChangeForm);
document.getElementById("btn-refresh-attempts").addEventListener("click", refreshAttempts);

/* ---------- 启动 ---------- */
(function init() {
  if (!CONFIG.supabase.url || !CONFIG.supabase.anonKey) {
    showLogin();
    document.getElementById("login-msg").textContent = "后台未配置 Supabase，请联系卖家配置后使用";
    document.getElementById("login-msg").className = "msg err";
    document.getElementById("btn-login").disabled = true;
    return;
  }
  var s = sGet();
  if (s && s.access_token && s.expires_at > Date.now()) {
    session = s;
    showPanel();
  } else if (s && s.refresh_token) {
    session = s;
    refreshSession().then(function () { showPanel(); }).catch(function () { showLogin(); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
